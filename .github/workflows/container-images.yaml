name: Container images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: ./mvnw -Drevision="${{ steps.version.outputs.value }}" package -B -ntp
        working-directory: backend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: release
          build-contexts: artifacts=./backend/target
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: release
          build-contexts: artifacts=./frontend/dist
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
