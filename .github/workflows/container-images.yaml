name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: ./mvnw -Drevision="${{ steps.version.outputs.value }}" test
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-backend:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fantasy-broadcast-web:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
