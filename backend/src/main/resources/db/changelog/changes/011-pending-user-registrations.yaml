databaseChangeLog:
  - changeSet:
      id: 011-create-pending-user-registrations
      author: codex
      changes:
        - createTable:
            tableName: pending_user_registration
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: verification_code_hash
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: pending_user_registration
            indexName: ix_pending_user_registration_expires_at
            columns:
              - column:
                  name: expires_at
