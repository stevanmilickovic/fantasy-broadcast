spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: backend
  task:
    scheduling:
      pool:
        # Billing reconciliation may wait on Paddle; access expiry must keep running.
        size: 2
  config:
    # Maven runs Spring Boot with backend/ as the working directory, while the
    # packaged app is normally launched from the repository root. Support both
    # local layouts; deployments set BROADCAST_CONFIG_DIRECTORY explicitly.
    import: optional:file:${BROADCAST_CONFIG_DIRECTORY:./data/backend}/application.yaml,optional:file:../data/backend/application.yaml
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  forward-headers-strategy: framework

fpl:
  draft-base-url: https://draft.premierleague.com/api
  fantasy-base-url: https://fantasy.premierleague.com/api
  timeout-seconds: ${FPL_TIMEOUT_SECONDS:15}
  cache-ttl-seconds: ${FPL_CACHE_TTL_SECONDS:3600}

broadcast:
  email:
    enabled: ${BROADCAST_EMAIL_ENABLED:true}
    from: ${BROADCAST_EMAIL_FROM:}
    public-base-url: ${BROADCAST_PUBLIC_BASE_URL:}
  security:
    public-base-url: ${BROADCAST_PUBLIC_BASE_URL:}
    league-registration-enabled: ${BROADCAST_LEAGUE_REGISTRATION_ENABLED:true}
    development-endpoints-enabled: ${BROADCAST_DEVELOPMENT_ENDPOINTS_ENABLED:true}
    exclusive-initial-admin: ${BROADCAST_EXCLUSIVE_INITIAL_ADMIN:false}
    initial-admin-email: ${BROADCAST_INITIAL_ADMIN_EMAIL:}
    initial-admin-password: ${BROADCAST_INITIAL_ADMIN_PASSWORD:}
  narration:
    enabled: ${BROADCAST_NARRATION_ENABLED:false}
    audio-enabled: ${BROADCAST_NARRATION_AUDIO_ENABLED:false}
    # Maximum time to wait for all text and (when enabled) audio before sending the plain notification.
    release-delay: ${BROADCAST_NARRATION_RELEASE_DELAY:1m}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_NARRATION_MODEL:gpt-5-nano}
      timeout-seconds: ${OPENAI_NARRATION_TIMEOUT_SECONDS:20}
    eleven-labs:
      api-key: ${ELEVENLABS_API_KEY:}
      base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io/v1}
      model-id: ${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
      voice-id: ${ELEVENLABS_VOICE_ID:}
      timeout-seconds: ${ELEVENLABS_TIMEOUT_SECONDS:30}
    limits:
      max-text-characters: ${BROADCAST_NARRATION_MAX_TEXT_CHARACTERS:220}
      max-narrations-per-league-gameweek: ${BROADCAST_NARRATION_MAX_PER_LEAGUE_GAMEWEEK:40}
      monthly-tts-character-budget: ${BROADCAST_NARRATION_MONTHLY_TTS_CHARACTERS:100000}
    storage:
      temp-directory: ${BROADCAST_NARRATION_TEMP_DIRECTORY:${java.io.tmpdir}/fantasy-broadcast/narrations}
      audio-ttl: ${BROADCAST_NARRATION_AUDIO_TTL:30m}
      cleanup-interval: ${BROADCAST_NARRATION_CLEANUP_INTERVAL:5m}

paddle:
  ai-broadcaster-enabled: ${PADDLE_AI_BROADCASTER_ENABLED:false}
  api-key: ${PADDLE_API_KEY:}
  client-side-token: ${PADDLE_CLIENT_SIDE_TOKEN:}
  standard-price-id: ${PADDLE_STANDARD_PRICE_ID:}
  ai-broadcaster-price-id: ${PADDLE_AI_BROADCASTER_PRICE_ID:}
  webhook-secret-key: ${PADDLE_WEBHOOK_SECRET_KEY:}
  api-url: ${PADDLE_API_URL:https://sandbox-api.paddle.com}

---
spring:
  config:
    activate:
      on-profile: db
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/fantasy_broadcast}
    username: ${DB_USERNAME:fantasy_broadcast}
    password: ${DB_PASSWORD:fantasy_broadcast}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
