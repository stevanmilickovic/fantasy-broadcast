services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stk_broadcast
      MYSQL_USER: stk_broadcast
      MYSQL_PASSWORD: stk_broadcast
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
